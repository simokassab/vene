      must_have: "لا غنى عنها"
      hero_eyebrow: "مجوهرات فاخرة"
      hero_heading: "خالدة بالتصميم"
      hero_body: "في فينيه للمجوهرات، نصنع قطعاً خالدة تحتفي بلحظات الحياة الثمينة. مصنوعة يدوياً في بيروت من ذهب عيار 18 قيراطاً، والألماس، والفضة الإسترليني — كل قطعة صُنعت لتبقى عزيزة، اليوم ولأجيالٍ قادمة."
      hero_cta: "اكتشف المجموعة"
      story_eyebrow: "قصتنا"
      story_heading: "قصة فينيه للمجوهرات"
      story_p1: "بعض أجمل ما في الحياة يولد من رحم الإحباط — وفينيه للمجوهرات ليست استثناءً. بدأت الحكاية كما تبدأ عند كثيرين منّا: نقف في متجر مجوهرات، ننتقل بأنظارنا بين واجهة وأخرى تتلألأ، ثم نخرج بلا شيء. لا لأن ما رأيناه لم يكن جميلاً، بل لأن شيئاً منه لم يكن يشبهنا. كانت القطع مألوفة أكثر من اللازم، ومتوقّعة أكثر من اللازم، وشبيهة بكل ما يوجد على كل رفٍّ في كل متجر آخر."
      story_p2: "أردنا شيئاً مقصوداً. شيئاً يحمل حكاية، ومزاجاً، وقوّة هادئة. أردنا مجوهرات تشبهنا — ولم نجدها ببساطة. وبدلاً من أن نرضى بالمتاح، صنعناها بأنفسنا."
      story_p3: "وُلدت فينيه للمجوهرات من تلك اللحظة، لحظة الرفض: رفض أن نرتدي شيئاً لمجرّد أنه موجود، ورفض المساومة على الشعور الذي نريده حين نضع قطعة مجوهرات. نؤمن بأن المجوهرات ليست مجرّد إكمال لإطلالة. يجب أن تقول شيئاً. يجب أن تعني شيئاً. يجب أن تجعلك تعود إليها مرّة بعد مرّة لأنها تخصّك أنت، بطريقة لا تمنحها لك قطعة عاديّة من رفٍّ عادي."
      story_p4: "بدأنا نصمّم لأنفسنا، وسرعان ما أدركنا أننا لسنا وحدنا. كان هناك آخرون — نساء ورجال خرجوا من المتاجر ذاتها بالخيبة الهادئة نفسها. أشخاص أرادوا أكثر ممّا يقدّمه السوق. أشخاص يستحقّون أكثر."
      story_p5: "هذا هو نبض فينيه للمجوهرات. كل قطعة نصنعها هي جواب مباشر عن فراغ شعرنا به بأنفسنا — تصميم لم يكن موجوداً حتى جعلناه موجوداً. نحن مهووسون بالتفاصيل، وبالتناسب، وبالإحساس الذي تمنحك إياه القطعة حين يلامسها الضوء أو تستقرّ على بشرتك. لا شيء يُصنع لملء كتالوج. كل شيء يُصنع لملء فراغ."
      story_closing: "فينيه ليست مجرّد علامة مجوهرات. إنها ما يحدث حين تتوقّف عن انتظار أن يصنع أحدهم ما كنت تبحث عنه دائماً."
