      must_have: "Must Have"
      hero_eyebrow: "Fine Jewelry"
      hero_heading: "Timeless by Design"
      hero_body: "At VENÈ Jewelry, we create timeless pieces that celebrate life's meaningful moments. Handcrafted in Beirut from 18K gold, diamonds, and sterling silver — each piece is made to be cherished, today and for generations to come."
      hero_cta: "Discover the Collection"
      story_eyebrow: "Our Story"
      story_heading: "The Story Behind VENÈ Jewelry"
      story_p1: "Some of the best things in life are born out of frustration — and VENÈ JEWELRY is no exception. It started the way it starts for so many of us: standing in a jewelry store, scanning case after case of gleaming displays, only to walk out empty-handed. Not because nothing was beautiful — but because nothing felt right. The pieces were too common, too predictable, too much like everything else on every other shelf in every other store."
      story_p2: "We wanted something that felt intentional. Something that carried a story, a mood, a quiet kind of power. We wanted jewelry that felt like us — and we simply couldn't find it. So instead of settling, we created it."
      story_p3: "VENÈ JEWELRY was born from that moment of refusal — the refusal to wear something just because it existed, the refusal to compromise on how we wanted to feel when we put on a piece of jewelry. We believed that jewelry shouldn't just accessorize an outfit. It should say something. It should mean something. It should make you reach for it again and again because it belongs to you in a way nothing off a standard shelf ever could."
      story_p4: "We started designing for ourselves, and quickly realized we weren't alone. There were others out there — women and men who had walked out of those same stores with that same quiet disappointment. People who wanted more than what the market was offering. People who deserved more."
      story_p5: "That is the heartbeat of VENÈ JEWELRY. Every piece we create is a direct answer to a gap we felt personally — a design that didn't exist until we made it exist. We obsess over the details, the proportions, the feeling a piece gives you when it catches the light or rests against your skin. Nothing is made to fill a catalog. Everything is made to fill a void."
      story_closing: "VENÈ isn't just a jewelry brand. It's what happens when you stop waiting for someone else to make what you've always been looking for."
